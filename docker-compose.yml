version: '3.8'

services:
  livekit-server:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    networks:
      - livekit-network
    restart: unless-stopped

  jarvis-app:
    build:
      context: ./jarvis
      dockerfile: Dockerfile
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      # Backend Envs
      - LIVEKIT_URL=ws://livekit-server:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - JARVIS_MODE=local
      # Frontend Envs
      - NEXT_PUBLIC_LIVEKIT_URL=ws://localhost:7880
    depends_on:
      - livekit-server
    networks:
      - livekit-network
    restart: unless-stopped
    volumes:
      # Docker Socket for container control
      - /var/run/docker.sock:/var/run/docker.sock
      # Backend
      - ./jarvis/.env.local:/app/.env.local:rw
      - ./jarvis/.env.cloud:/app/.env.cloud:rw
      - ./jarvis/active_mode.txt:/app/active_mode.txt:rw
      # Frontend
      - ./jarvis/frontend/.env.local:/app/frontend/.env.local:rw
      - ./jarvis/frontend/.env.cloud:/app/frontend/.env.cloud:rw

networks:
  livekit-network:
    driver: bridge
